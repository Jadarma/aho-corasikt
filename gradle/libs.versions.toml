[versions]
kotlin = "2.3.20"        # https://central.sonatype.com/artifact/org.jetbrains.kotlin/kotlin-gradle-plugin/versions

detekt = "2.0.0-alpha.2" # https://central.sonatype.com/artifact/dev.detekt/detekt-gradle-plugin/versions
kotest = "6.1.10"        # https://central.sonatype.com/artifact/io.kotest/kotest-framework-engine-jvm/versions
kover = "0.9.8"          # https://central.sonatype.com/artifact/org.jetbrains.kotlinx.kover/org.jetbrains.kotlinx.kover.gradle.plugin/versions
ksp = "2.3.6"            # https://central.sonatype.com/artifact/com.google.devtools.ksp/com.google.devtools.ksp.gradle.plugin/versions

[libraries]
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotest = { id = "io.kotest", version.ref = "kotest" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[versions]
kotlin = "2.4.21"        # https://central.sonatype.com/artifact/org.jetbrains.kotlin/kotlin-gradle-plugin/versions

benchmark = "0.6.0-rc"   # https://plugins.gradle.org/plugin/org.jetbrains.kotlinx.benchmark
detekt = "2.0.0-alpha.6" # https://central.sonatype.com/artifact/dev.detekt/detekt-gradle-plugin/versions
dokka = "2.3.0"          # https://central.sonatype.com/artifact/org.jetbrains.dokka/dokka-gradle-plugin/versions
kotest = "6.2.7"         # https://central.sonatype.com/artifact/io.kotest/kotest-framework-engine-jvm/versions
kover = "0.9.11"         # https://central.sonatype.com/artifact/org.jetbrains.kotlinx.kover/org.jetbrains.kotlinx.kover.gradle.plugin/versions
ksp = "2.3.10"           # https://central.sonatype.com/artifact/com.google.devtools.ksp/com.google.devtools.ksp.gradle.plugin/versions
publishing = "0.37.0"    # https://central.sonatype.com/artifact/com.vanniktech.maven.publish/com.vanniktech.maven.publish.gradle.plugin/versions
testResources = "0.16.3" # https://plugins.gradle.org/plugin/com.goncalossilva.resources
toolchains = "1.0.0"     # https://plugins.gradle.org/plugin/org.gradle.toolchains.foojay-resolver-convention

[libraries]
kotest-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-junit = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "benchmark" }
testResources = { module = "com.goncalossilva:resources", version.ref = "testResources" }

gradlePluginDep-benchmark = { module = "org.jetbrains.kotlinx.benchmark:org.jetbrains.kotlinx.benchmark.gradle.plugin", version.ref = "benchmark" }
gradlePluginDep-detekt = { module = "dev.detekt:dev.detekt.gradle.plugin", version.ref = "detekt" }
gradlePluginDep-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
gradlePluginDep-kotest = { module = "io.kotest:io.kotest.gradle.plugin", version.ref = "kotest" }
gradlePluginDep-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePluginDep-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
gradlePluginDep-ksp = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
gradlePluginDep-publishing = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "publishing" }
gradlePluginDep-resources = { module = "com.goncalossilva.resources:com.goncalossilva.resources.gradle.plugin", version.ref = "testResources" }
gradlePluginDep-toolchains = { module = "org.gradle.toolchains.foojay-resolver-convention:org.gradle.toolchains.foojay-resolver-convention.gradle.plugin", version.ref = "toolchains" }

[bundles]
# Bundles all plugins needed in `buildLogic` so they can be imported in bulk.
gradlePlugins = [
    "gradlePluginDep-benchmark",
    "gradlePluginDep-detekt",
    "gradlePluginDep-dokka",
    "gradlePluginDep-kotest",
    "gradlePluginDep-kotlin",
    "gradlePluginDep-kover",
    "gradlePluginDep-ksp",
    "gradlePluginDep-publishing",
    "gradlePluginDep-resources",
    "gradlePluginDep-toolchains",
]

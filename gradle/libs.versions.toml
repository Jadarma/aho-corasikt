[versions]
kotlin = "2.3.21"        # https://central.sonatype.com/artifact/org.jetbrains.kotlin/kotlin-gradle-plugin/versions

benchmark = "0.4.16"     # https://plugins.gradle.org/plugin/org.jetbrains.kotlinx.benchmark
detekt = "2.0.0-alpha.2" # https://central.sonatype.com/artifact/dev.detekt/detekt-gradle-plugin/versions
kotest = "6.1.11"        # https://central.sonatype.com/artifact/io.kotest/kotest-framework-engine-jvm/versions
kover = "0.9.8"          # https://central.sonatype.com/artifact/org.jetbrains.kotlinx.kover/org.jetbrains.kotlinx.kover.gradle.plugin/versions
ksp = "2.3.7"            # https://central.sonatype.com/artifact/com.google.devtools.ksp/com.google.devtools.ksp.gradle.plugin/versions
testResources = "0.15.0" # https://plugins.gradle.org/plugin/com.goncalossilva.resources

[libraries]
kotest-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-junit = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "benchmark" }
testResources = { module = "com.goncalossilva:resources", version.ref = "testResources" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "benchmark" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotest = { id = "io.kotest", version.ref = "kotest" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
testResources = { id = "com.goncalossilva.resources", version.ref = "testResources" }

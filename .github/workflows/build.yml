name: 'Build'

# Action Dependency Pins:
# actions/checkout            - 3d3c42e5aac5ba805825da76410c181273ba90b1 - v7.0.1 - https://github.com/actions/checkout/releases
# actions/setup-java          - d1374f8ac74474200d16ef8ecee22c7ae7a51880 - v6.3.0 - https://github.com/actions/setup-java/releases
# actions/upload-artifact     - cf430e030ddbb5b0abf93d22962f4752f3646cd9 - v7.0.2 - https://github.com/actions/upload-artifact/releases
# gradle/actions/setup-gradle - 8da46b539cd8fe6ab27ca75128919a18d757604c - v6.4.1 - https://github.com/gradle/actions/releases

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Build:
    runs-on: macos-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 'Setup Java'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: 'basic'
      - name: 'Build'
        run: ./gradlew build
      - name: 'Upload Build Reports'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'build-reports'
          path: 'build/reports'

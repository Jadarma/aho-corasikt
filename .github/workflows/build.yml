name: 'Build'

# Action Dependency Pins:
# actions/checkout            - de0fac2e4500dabe0009e67214ff5f5447ce83dd - v6.0.2 - https://github.com/actions/checkout/releases
# actions/setup-java          - be666c2fcd27ec809703dec50e508c2fdc7f6654 - v5.2.0 - https://github.com/actions/setup-java/releases
# actions/upload-artifact     - 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a - v7.0.1 - https://github.com/actions/upload-artifact/releases
# gradle/actions/setup-gradle - 50e97c2cd7a37755bbfafc9c5b7cafaece252f6e - v6.1.0 - https://github.com/gradle/actions/releases

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Build:
    runs-on: macos-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: 'Setup Java'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          cache-provider: 'basic'
      - name: 'Build'
        run: ./gradlew build
      - name: 'Upload Build Reports'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 'build-reports'
          path: 'build/reports'
